
QMAKE_OBJCFLAGS_PRECOMPILE       = -x objective-c-header -c ${QMAKE_PCH_INPUT} -o ${QMAKE_PCH_OUTPUT}
QMAKE_OBJCFLAGS_USE_PRECOMPILE   = $$QMAKE_CFLAGS_USE_PRECOMPILE
QMAKE_OBJCXXFLAGS_PRECOMPILE     = -x objective-c++-header -c ${QMAKE_PCH_INPUT} -o ${QMAKE_PCH_OUTPUT}
QMAKE_OBJCXXFLAGS_USE_PRECOMPILE = $$QMAKE_CFLAGS_USE_PRECOMPILE

QMAKE_XCODE_GCC_VERSION = com.apple.compilers.llvm.clang.1_0

QMAKE_CXXFLAGS += -stdlib=libc++
QMAKE_LFLAGS   += -stdlib=libc++

# C++14 is `-std=c++1y`, C++17 is `-std=c++1z`, C++20 is `-std=c++2a`.
QMAKE_CXXFLAGS *= \
    -std=c++1y \
    -Wno-deprecated-register \
    -Wno-ignored-attributes \
    # List terminator comment.

# Re-enables Objective-C exceptions on .m / .mm sources even when the C++
# build is compiled with `-fno-exceptions`. Cocoa code uses constructs like
# `@synchronized(self)` and `@try`/`@catch` that clang would otherwise reject
# with "unexpected '@' in program" since `-fno-exceptions` also disables ObjC
# exceptions by default.
#
# qmake's makefile generator on Mac compiles `.mm` files with the same
# clang++ invocation it uses for `.cpp`, applying QMAKE_CXXFLAGS rather than
# QMAKE_OBJCXXFLAGS, so the flag has to live there. `-fobjc-exceptions` is a
# no-op for plain C++ sources, so this is safe to apply across the board.
QMAKE_CFLAGS      += -fobjc-exceptions
QMAKE_CXXFLAGS    += -fobjc-exceptions
QMAKE_OBJCFLAGS   += -fobjc-exceptions
QMAKE_OBJCXXFLAGS += -fobjc-exceptions
