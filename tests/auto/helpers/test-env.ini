; The test environment every test of tests/auto reads (see testenv.h); test-env.pri
; writes it into the build tree, with the values only a qmake run knows filled in.

[server]
; Where the bundled server-dummy listens.
host=localhost
port=45678

[bearer]
; The plugins dir of the Qt install, where the qbearerdummy engine plugin installs;
; test-env.pri fills it in.
pluginpath=
