; The HTTP routes server-dummy answers, compiled into it (server-dummy.qrc).
;
; A request is matched against the routes in the order this file lists them,
; and the first route that answers it wins; a test folder's server-config.ini
; may replace a route by its name, or add routes in front of these.
;
; Each [Routes/<name>] section names:
; * path      an exact request path (the query is not part of it); may repeat.
; * prefix    the start of a request path; may repeat.
; * listener  the listeners the route is limited to: plain (HTTP), secure
;             (HTTPS and SPDY), or http2; all of them when absent.
; * type      the reply, whose settings are the section's other keys:
;   static          code, reason, body; `<method>.code` and the like apply to
;                   that method only. A reply of 400 or above with no body
;                   setting carries its reason as body.
;   null-bytes      size NUL bytes, after the head bytes.
;   repeated-byte   size copies of byte.
;   repeated-text   text, repeated to at least size bytes; content-encoding
;                   gzip encodes it.
;   echo            the request body (source = body), else the body of a POST
;                   or PUT and the query of any other method.
;   basic-auth      user, password, realm, reason, challenge-text; then serve
;                   = text (the text), files (a file below strip), or
;                   redispatch (the route answering the path with strip
;                   replaced by replace).
;   digest-auth     user, password, realm, nonce, algorithm, qop, reason,
;                   challenge-text, text; check = full (the response hash) or
;                   user (the user name alone).
;   webdav          an in-memory store: PUT stores, GET reads, DELETE drops.
;   query-status    the status the query starts with, of the listed codes,
;                   with its reason.<code> and body.<code>; else 404.
;   cache-test      the httpcachetest_*.cgi family, named below strip.
;   cookie-echo     the request's Cookie header as body.
;   set-cookie      a Set-Cookie header per line of the request body.
;   unknown-auth    a challenge of the scheme Qt does not know, 407 when the
;                   query starts with 407, else 401; text.
;   md5sum          the MD5 of the request body.
;   multipart       one line per part of a multipart body.
;   directory-index the folder's file (index.html), else text.
;   gzip-files      a file below strip, gzip encoded; else 404.
;   files           a file below strip; a missing file leaves the request to
;                   the next route.
; * headers.<name>  a reply header, replacing the one the type sets (such as
;                   its content-type); an empty value leaves the header out.
;                   `<method>.headers.<name>` applies to that method only.
;
; Sizes take a unit: B, KB, KiB, MB, MiB, GB, or GiB (none means bytes).
; Values may carry C escapes (\n, \t, \0, \xNN, \\), and keep their outer
; spaces in double quotes.

; MARK: HTTP/2.

; HTTP/2 serves the fixture files below /qtest/, and a fixed page otherwise.
[Routes/http2-files]
listener = http2
prefix = /qtest/
type = files
strip = /qtest/

; The page of any other HTTP/2 path.
[Routes/http2-page]
listener = http2
prefix = /
type = static
headers.content-type = text/html
body = <html><body>hello http/2</body></html>

; MARK: plain HTTP.

; Echoes the request body, whatever the method.
[Routes/plain-echo]
listener = plain
path = /qtest/cgi-bin/echo.cgi
type = echo
source = body

; Answers with an empty body, for the pipelining test.
[Routes/plain-empty-echo]
listener = plain
path = /cgi-bin/echo.cgi
type = static

; Stands in for rfc3252.txt by its exact size, 25962.
[Routes/plain-rfc3252]
listener = plain
path = /qtest/rfc3252.txt
type = repeated-byte
byte = x
size = 25962

; Large enough to stream.
[Routes/plain-bigfile]
listener = plain
path = /qtest/bigfile
type = repeated-byte
byte = x
size = 512 KiB

; Stands in for the RFC 2616 fixture; the compression rows assert the length
; served here, identity and gzipped.
[Routes/plain-rfc2616]
listener = plain
path = /qtest/rfcs/rfc2616.html
type = repeated-text
text = The Hypertext Transfer Protocol (HTTP) is an application-level protocol for distributed, collaborative, hypermedia information systems.\n
size = 40000

; The pre-gzipped variant, served with its Content-Encoding; hence the client
; keeps the compressed bytes, and the compression row asserts that gzipped
; length.
[Routes/plain-rfc2616-gzip]
listener = plain
path = /qtest/deflate/rfc2616.html
type = repeated-text
text = The Hypertext Transfer Protocol (HTTP) is an application-level protocol for distributed, collaborative, hypermedia information systems.\n
size = 40000
content-encoding = gzip

; Basic authentication with the tests' account, httptest:httptest; the bare
; directory is matched too.
[Routes/plain-rfcs-auth]
listener = plain
path = /qtest/rfcs-auth
prefix = /qtest/rfcs-auth/
type = basic-auth
user = httptest
password = httptest
realm = test
reason = Unauthorized
challenge-text = Unauthorized\n
serve = text
text = httptest login

; Accepts the user name alone, enough to tell the tests' account from a wrong
; one.
[Routes/plain-auth-digest]
listener = plain
prefix = /qtest/auth-digest/
type = digest-auth
check = user
user = httptest
realm = test
nonce = abc123nonce
qop = auth
reason = Unauthorized
challenge-text = Unauthorized\n
text = httptest login

; Accepts every WebDAV request: 201 to a PUT, 200 otherwise.
[Routes/plain-dav]
listener = plain
prefix = /dav/
type = static
reason = Created
put.code = 201

; A read-only WebDAV area.
[Routes/plain-dav2]
listener = plain
prefix = /dav2/
type = static
code = 405
reason = Method Not Allowed

; A path that does not exist.
[Routes/plain-t]
listener = plain
path = /t
type = static
code = 404
reason = Not Found

; MARK: every listener.

; An in-memory WebDAV store: a PUT stores the body (201 Created), a later GET
; reads it back, and a DELETE drops it.
[Routes/webdav]
prefix = /dav/
type = webdav

; The landing page; several SSL rows GET https://<host>/index.html and expect
; 200. A DELETE of it is not allowed.
[Routes/landing-page]
path = /
path = /index.html
type = static
headers.content-type = text/html
headers.server = Apache/2.2.22 (Unix)
headers.last-modified = Tue, 13 May 2014 16:53:20 GMT
body = <html><head><title>server-dummy</title></head><body><h1>It works!</h1></body></html>\n
delete.code = 405
delete.reason = Method Not Allowed
delete.headers.content-type =
delete.headers.server =
delete.headers.last-modified =
delete.body =
delete.headers.allow = GET, HEAD

; Returns the status the query names (http-delete.cgi?<status>).
[Routes/http-delete]
path = /qtest/cgi-bin/http-delete.cgi
type = query-status
codes = 200, 202, 204
reason.200 = OK
body.200 = ok\n
reason.202 = Accepted
body.202 = accepted\n
reason.204 = No Content

; Basic-auth-protected content: the resource below the segment, once the
; credentials match.
[Routes/protected]
prefix = /qtest/protected/
type = basic-auth
user = httptest
password = httptest
serve = redispatch
strip = /qtest/protected/
replace = /qtest/

; The bare directory is matched too: getErrors(http-authentication) expects its
; 401 challenge.
[Routes/rfcs-auth]
path = /qtest/rfcs-auth
prefix = /qtest/rfcs-auth/
type = basic-auth
user = httptest
password = httptest
serve = files
strip = /qtest/rfcs-auth/

; Checks the RFC 2617 response hash; hence a wrong password or user in the URL
; is challenged again (ioGetFromHttpWithAuth(digest-bad-*-in-url)).
[Routes/auth-digest]
prefix = /qtest/auth-digest
type = digest-auth
check = full
user = httptest
password = httptest
realm = QAuthenticator
nonce = aaaaaaaaaaaaaaaa
algorithm = MD5
qop = auth
text = digest authentication successful\n

; The httpcachetest_*.cgi family: the response headers drive whether the
; client's QNetworkDiskCache stores and/or revalidates the entry.
[Routes/cache-test]
prefix = /qtest/cgi-bin/httpcachetest_
type = cache-test
strip = /qtest/cgi-bin/

; A POST or PUT echoes the request body back (putWithRateLimiting round-trips
; its whole upload); a GET carries no body, and the content-negotiation rows
; fetch "?1" expecting the body "1", hence it echoes the query instead.
[Routes/echo]
path = /qtest/cgi-bin/echo.cgi
type = echo

; Echoes the request's Cookie header as the body; hence sendCookies can verify
; which cookies the jar sent.
[Routes/get-cookie]
path = /qtest/cgi-bin/get-cookie.cgi
type = cookie-echo

; The POST body carries cookie definitions, one per line
; ("<name>=<value>[; attrs]"); each becomes a Set-Cookie header, which
; receiveCookiesFromHttp reads in SetCookieHeader and in the jar.
[Routes/set-cookie]
path = /qtest/cgi-bin/set-cookie.cgi
type = set-cookie

; A fixed-date image: lastModifiedHeaderForHttp asserts its Last-Modified, and
; httpRecursiveCreation its size, 27906.
[Routes/fluke]
path = /qtest/fluke.gif
type = null-bytes
headers.content-type = image/gif
head = GIF89a\x01\x00\x01\x00\x00\x00\x00;
size = 27906
headers.last-modified = Tue, 22 May 2007 12:04:57 GMT

; Challenges with a scheme Qt does not implement (Bogus); hence
; authorizationError sees the request fail with the authentication kept
; unsatisfied: 401 (AuthenticationRequiredError), or 407 for a query starting
; with 407 (ProxyAuthenticationRequiredError). The body is exactly
; "authorization required", since the test compares the reply size.
[Routes/unknown-auth]
path = /qtest/cgi-bin/http-unknown-authentication-method.cgi
type = unknown-auth
scheme = Bogus
text = authorization required

; Answers the MD5 of the request body.
[Routes/md5sum]
path = /qtest/cgi-bin/md5sum.cgi
type = md5sum

; Answers one line per part: a form-data text field with its raw value, a
; typed form-data part (an uploaded file) with its MD5, and any other
; multipart type with its headers and content.
[Routes/multipart]
path = /qtest/cgi-bin/multipart.cgi
type = multipart

; The /qtest/ directory index.
[Routes/qtest-index]
path = /qtest/
path = /qtest/index.html
type = directory-index
file = index.html
text = <html><body>qtest</body></html>\n

; The underlying fixture file gzip encoded (Content-Encoding: gzip); hence
; QNAM inflates it on its own (synchronousRequest(http-gzip)).
[Routes/deflate]
prefix = /qtest/deflate/
type = gzip-files
strip = /qtest/deflate/

; Exactly 10 MB of NUL bytes: large enough that a download still runs when a
; test changes its session's policy, and all-NUL for a test that counts the
; body from the first NUL past the ASCII headers.
[Routes/mediumfile]
path = /qtest/mediumfile
type = null-bytes
size = 10 MB

; The fixture files of the --folder, below /qtest/.
[Routes/files]
prefix = /qtest/
type = files
strip = /qtest/
