; server-dummy reads this from its --folder. General knobs for the bundled test server.
; All paths here are relative to THIS file's own directory (which is server-dummy's --folder,
; i.e. the FTP root), so a key resolves to the same filesystem location a request maps to.
;
; [Unreachable] maps a resource path to the error it should simulate: the path is treated as
; "exists but unreachable" -- a stat (FTP SIZE) succeeds so it looks present, but the fetch
; (FTP RETR) is denied, so a client sees a content-access-denied error, not not-found. The value
; is the HTTP-style status the denial stands for (403 = forbidden / not readable); the FTP server
; renders any listed path as a 550-denied RETR. A listed directory covers everything under it.
; Keys are quoted so paths may contain spaces or slashes.
;
; Drives tst_QNetworkReply::getErrors(ftp-file-not-readable) without a real permission-denied file.
[Unreachable]
"./pub/file-not-readable.txt" = 403
"./pub/dir-not-readable" = 403

; [IO] holds transfer knobs. rateLimit caps a server-dummy transfer in bytes/sec (0 = unlimited),
; parsed into ServiceConfigDynamic::rateLimit() and available live via the IniWatcher. Left at 0
; here: the only rate-limited network-reply rows (ioGetFromBuiltinHttp *+limited) are driven by the
; test's own in-process FastSender, not server-dummy, so they are paced/timed test-side instead.
;
; responseDelayMs adds an artificial per-response latency (ms, 0 = none), parsed into
; ServiceConfigDynamic::responseDelayMs(). A test that needs the server to take some RTT before
; answering -- so a first auth retry can settle the per-host credential cache before a second
; parallel challenge lands -- raises this between test-cases via the TestServerEditor. It is a
; STABILISER, not a synchroniser (a uniform delay cannot serialise truly concurrent requests), so
; it is left at 0 by default and only nudged up where a row measurably benefits.
[IO]
rateLimit = 0
responseDelayMs = 0

; [TLS] fixedSessionTicketKey: when true, the TLS listener installs a FIXED RFC-5077 session-ticket
; key so the tickets it issues resume across separate client sockets (parsed into
; ServiceConfigDynamic::fixedSessionTicketKey(), read live per connection by SslServer). This is a
; deliberate loss of ticket-key rotation, so it is OFF by default -- only the session-resumption rows
; (tst_QNetworkReply::sslSessionSharing / ...FromPersistentSession) turn it on, for their own
; duration, via the TestServerEditor; every other connection keeps OpenSSL's random per-context key.
[TLS]
fixedSessionTicketKey = false
