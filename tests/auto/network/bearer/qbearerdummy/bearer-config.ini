[General]
isolate = true
serviceNetworks = false
defaultConfiguration = active

[Configurations/active]
name = Configured Ethernet
state = Active
bearer = BearerEthernet

[Configurations/delayed]
name = Configured WLAN
state = 0x6
bearer = WLAN
openDelayMs = 25

[Configurations/blocked]
state = Discovered
canStart = false

[Configurations/denied]
state = Discovered
bearer = 1
openError = 2

[Configurations/unavailable]
state = Defined

[Configurations/cannot-stop]
state = Active
canStop = false

[Configurations/unknown]
state = Discovered
openError = 0
